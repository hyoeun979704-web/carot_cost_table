<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단가표 자동 업데이트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { margin-top: 6px; color: #666; font-size: 0.9rem; }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      padding: 28px 32px;
      width: 100%;
      max-width: 700px;
    }

    .card + .card { margin-top: 20px; }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── 업로드 영역 ── */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 520px) { .upload-grid { grid-template-columns: 1fr; } }

    .drop-zone {
      border: 2px dashed #c5cae9;
      border-radius: 12px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #5c6bc0;
      background: #f0f2ff;
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .icon  { font-size: 2rem; margin-bottom: 8px; }
    .drop-zone .label { font-size: 0.85rem; color: #555; line-height: 1.5; }
    .drop-zone .label strong { display: block; color: #3949ab; font-size: 0.9rem; }
    .file-list {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #3949ab;
      text-align: left;
      word-break: break-all;
    }
    .file-list li { list-style: none; padding: 2px 0; }
    .file-list li::before { content: "✓ "; color: #43a047; }

    /* ── 실행 버튼 ── */
    #run-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #3949ab, #5c6bc0);
      color: #fff;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    #run-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    #run-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── 진행 상태 ── */
    #status-card { display: none; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #c5cae9;
      border-top-color: #3949ab;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 0.9rem; font-weight: 600; }

    .log-box {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: "D2Coding", "Consolas", monospace;
      font-size: 0.78rem;
      color: #c5cae9;
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-box .ok    { color: #69f0ae; }
    .log-box .warn  { color: #ffd54f; }
    .log-box .err   { color: #ef5350; }

    /* ── 다운로드 버튼 ── */
    #download-btn {
      display: none;
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: #fff;
      cursor: pointer;
      transition: opacity .2s;
    }
    #download-btn:hover { opacity: .9; }

    footer {
      margin-top: 40px;
      font-size: 0.78rem;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  <h1>📊 단가표 자동 업데이트</h1>
  <p>통신사 단가표 이미지를 분석해 엑셀 템플릿을 자동으로 업데이트합니다.</p>
</header>

<!-- 업로드 카드 -->
<div class="card">
  <h2>📁 파일 업로드</h2>
  <div class="upload-grid">

    <!-- 이미지 -->
    <div>
      <div style="font-size:.8rem;font-weight:600;margin-bottom:8px;color:#555;">단가표 이미지 (복수 선택 가능)</div>
      <div class="drop-zone" id="img-zone">
        <input type="file" id="img-input" accept="image/*" multiple />
        <div class="icon">🖼️</div>
        <div class="label">
          <strong>이미지 선택 / 드래그</strong>
          JPG, PNG, WEBP
        </div>
      </div>
      <ul class="file-list" id="img-list"></ul>
    </div>

    <!-- 엑셀 템플릿 -->
    <div>
      <div style="font-size:.8rem;font-weight:600;margin-bottom:8px;color:#555;">엑셀 템플릿</div>
      <div class="drop-zone" id="tpl-zone">
        <input type="file" id="tpl-input" accept=".xlsx" />
        <div class="icon">📋</div>
        <div class="label">
          <strong>템플릿 선택 / 드래그</strong>
          .xlsx 파일
        </div>
      </div>
      <ul class="file-list" id="tpl-list"></ul>
    </div>

  </div>

  <button id="run-btn" disabled>분석 시작</button>
</div>

<!-- 진행 상태 카드 -->
<div class="card" id="status-card">
  <h2>⚙️ 처리 현황</h2>
  <div class="status-bar">
    <div class="spinner" id="spinner"></div>
    <span class="status-text" id="status-text">준비 중...</span>
  </div>
  <div class="log-box" id="log-box"></div>
  <button id="download-btn">⬇️ 업데이트된 엑셀 다운로드</button>
</div>

<footer>Claude Vision API · FastAPI · openpyxl</footer>

<script>
  let currentJobId = null;
  let pollTimer = null;

  const imgInput  = document.getElementById('img-input');
  const tplInput  = document.getElementById('tpl-input');
  const imgList   = document.getElementById('img-list');
  const tplList   = document.getElementById('tpl-list');
  const runBtn    = document.getElementById('run-btn');
  const statusCard  = document.getElementById('status-card');
  const statusText  = document.getElementById('status-text');
  const spinner     = document.getElementById('spinner');
  const logBox      = document.getElementById('log-box');
  const downloadBtn = document.getElementById('download-btn');

  // ── 파일 목록 업데이트 ──
  function renderFileList(files, listEl) {
    listEl.innerHTML = '';
    for (const f of files) {
      const li = document.createElement('li');
      li.textContent = f.name;
      listEl.appendChild(li);
    }
  }

  imgInput.addEventListener('change', () => {
    renderFileList(imgInput.files, imgList);
    updateRunBtn();
  });
  tplInput.addEventListener('change', () => {
    renderFileList(tplInput.files, tplList);
    updateRunBtn();
  });

  function updateRunBtn() {
    runBtn.disabled = !(imgInput.files.length > 0 && tplInput.files.length > 0);
  }

  // ── 드래그 앤 드롭 ──
  function setupDrop(zone, input) {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const dt = e.dataTransfer;
      if (!dt.files.length) return;
      // DataTransfer → input.files 교체 (브라우저 제약 우회)
      const dataTransfer = new DataTransfer();
      for (const f of dt.files) dataTransfer.items.add(f);
      input.files = dataTransfer.files;
      input.dispatchEvent(new Event('change'));
    });
  }
  setupDrop(document.getElementById('img-zone'), imgInput);
  setupDrop(document.getElementById('tpl-zone'), tplInput);

  // ── 로그 렌더링 ──
  function renderLog(lines) {
    logBox.innerHTML = lines.map(line => {
      if (line.includes('✅') || line.includes('✓')) return `<span class="ok">${esc(line)}</span>`;
      if (line.includes('⚠') || line.includes('매칭 실패')) return `<span class="warn">${esc(line)}</span>`;
      if (line.includes('❌')) return `<span class="err">${esc(line)}</span>`;
      return esc(line);
    }).join('\n');
    logBox.scrollTop = logBox.scrollHeight;
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── 폴링 ──
  async function poll(jobId) {
    try {
      const res = await fetch(`/api/status/${jobId}`);
      const data = await res.json();
      renderLog(data.log);

      if (data.status === 'done') {
        clearInterval(pollTimer);
        spinner.style.display = 'none';
        statusText.textContent = '완료!';
        downloadBtn.style.display = 'block';
        runBtn.disabled = false;
      } else if (data.status === 'error') {
        clearInterval(pollTimer);
        spinner.style.display = 'none';
        statusText.textContent = '오류 발생';
        statusText.style.color = '#ef5350';
        runBtn.disabled = false;
      } else {
        statusText.textContent = '분석 중...';
      }
    } catch (e) {
      console.error(e);
    }
  }

  // ── 실행 ──
  runBtn.addEventListener('click', async () => {
    if (!imgInput.files.length || !tplInput.files.length) return;

    // 이전 작업 정리
    if (currentJobId) {
      fetch(`/api/job/${currentJobId}`, { method: 'DELETE' }).catch(() => {});
    }
    clearInterval(pollTimer);

    runBtn.disabled = true;
    downloadBtn.style.display = 'none';
    statusCard.style.display = 'block';
    spinner.style.display = '';
    statusText.style.color = '';
    statusText.textContent = '업로드 중...';
    logBox.innerHTML = '';

    const fd = new FormData();
    for (const f of imgInput.files) fd.append('images', f);
    fd.append('template', tplInput.files[0]);

    try {
      const res = await fetch('/api/analyze', { method: 'POST', body: fd });
      if (!res.ok) {
        const err = await res.json();
        statusText.textContent = '업로드 실패';
        logBox.textContent = err.detail || JSON.stringify(err);
        runBtn.disabled = false;
        return;
      }
      const { job_id } = await res.json();
      currentJobId = job_id;
      statusText.textContent = '분석 중...';
      pollTimer = setInterval(() => poll(job_id), 1500);
    } catch (e) {
      statusText.textContent = '네트워크 오류';
      logBox.textContent = String(e);
      runBtn.disabled = false;
    }
  });

  // ── 다운로드 ──
  downloadBtn.addEventListener('click', () => {
    if (!currentJobId) return;
    window.location.href = `/api/download/${currentJobId}`;
  });
</script>
</body>
</html>
